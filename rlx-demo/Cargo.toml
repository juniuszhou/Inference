[package]
# Not "rlx": the package depends on the upstream `rlx` crate, and a package
# cannot share its name with one of its dependencies (rustc would see two
# rlibs named `rlx` and fail with E0464).
name = "rlx-usage"
version = "0.1.0"
edition = "2024"

# Own workspace, detached from the root Inference workspace: rlx-cuda requires
# cudarc's `dynamic-loading` feature, while candle (in the root workspace)
# requires `dynamic-linking`. cudarc's build script forbids both features in
# one build graph, so this crate must resolve its dependencies separately.
[workspace]

[dependencies]
rlx = { version = "0.2.13", git = "https://github.com/MIT-RLX/rlx.git", features = [
    "cuda",
    "distributed",
] }

rlx-cuda = { version = "0.2.13", git = "https://github.com/MIT-RLX/rlx.git", features = [
    "nccl",
] }

# Used by tests/basic.rs.
rlx-tensor = { version = "0.2.13", git = "https://github.com/MIT-RLX/rlx.git", features = [
    "eval-cuda",
] }

# Used by tests/tokenizer.rs.
rlx-text = { version = "0.2.13", git = "https://github.com/MIT-RLX/rlx.git" }

# Used by tests/distributed.rs (SymmetricTransport / NVSHMEM stand-in).
rlx-driver = { version = "0.2.13", git = "https://github.com/MIT-RLX/rlx.git" }

[package]
name = "first"
version = "0.1.0"
edition = "2024"

# The binary has no unit tests; building it in test mode breaks the
# cuda-oxide device artifact embedding.
[[bin]]
name = "first"
path = "src/main.rs"
test = false

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git" }
# default-features = false disables libm's `arch` feature, whose x86 inline
# asm (e.g. `sqrtss` in sqrtf) cannot be translated by the CUDA device codegen.
libm = { version = "0.2", default-features = false }